[project]
name = "yahoo-prices-warehouse"
version = "0.1.0"
description = "Build your own local Yahoo Finance price database (ArcticDB) with resumable updates and a read API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "arcticdb>=4.0",
    "yfinance>=0.2.40",
    "pandas>=1.5",
    "numpy>=1.23",
    "fuzzywuzzy>=0.18",
    "xlsxwriter>=3.0",
    "psutil>=5.9",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["market_data*"]

[tool.ruff]
line-length = 88
